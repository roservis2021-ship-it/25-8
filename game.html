<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEBULA BLITZ — Shooter 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 18px 28px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
    font-family: 'Orbitron', monospace;
  }
  .hud-card {
    background: rgba(0,255,200,.07);
    border: 1px solid rgba(0,255,200,.25);
    border-radius: 6px;
    padding: 10px 18px;
    color: #00ffc8;
    text-shadow: 0 0 10px #00ffc8;
  }
  .hud-label { font-size: 9px; letter-spacing: 3px; opacity: .6; text-transform: uppercase; }
  .hud-val   { font-size: 26px; font-weight: 700; line-height: 1.25; }

  #lives-row { display: flex; gap: 7px; margin-top: 5px; }
  .heart {
    width: 13px; height: 13px;
    background: #00ffc8;
    clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    box-shadow: 0 0 8px #00ffc8;
    transition: all .3s;
  }
  .heart.dead { background: #1a1a2e; box-shadow: none; }

  /* ── Overlay screens ── */
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,3,8,.88);
    z-index: 30;
    font-family: 'Orbitron', monospace;
    color: #00ffc8; text-align: center;
  }
  #overlay h1 {
    font-size: clamp(42px,8vw,80px);
    letter-spacing: 10px;
    text-shadow: 0 0 30px #00ffc8, 0 0 60px #00ffc880;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  #overlay .sub { font-size: 13px; opacity: .6; letter-spacing: 2px; margin-bottom: 6px; }
  .neon-btn {
    margin-top: 28px;
    padding: 14px 46px;
    background: transparent;
    border: 2px solid #00ffc8;
    color: #00ffc8;
    font-family: 'Orbitron', monospace;
    font-size: 16px; letter-spacing: 4px;
    cursor: pointer;
    text-shadow: 0 0 10px #00ffc8;
    box-shadow: 0 0 20px rgba(0,255,200,.25);
    transition: box-shadow .2s, background .2s;
  }
  .neon-btn:hover {
    background: rgba(0,255,200,.08);
    box-shadow: 0 0 40px rgba(0,255,200,.5);
  }

  /* ── Wave announcement ── */
  #wave-msg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px,5vw,52px);
    letter-spacing: 8px;
    color: #00ffc8;
    text-shadow: 0 0 30px #00ffc8;
    pointer-events: none;
    opacity: 0;
    z-index: 20;
    transition: opacity .5s;
  }

  /* ── Custom crosshair ── */
  #xhair {
    position: fixed; pointer-events: none; z-index: 5;
    transform: translate(-50%,-50%);
    opacity: .75;
  }

  /* ── Controls hint ── */
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(0,255,200,.35);
    font-family: 'Orbitron', monospace;
    font-size: 10px; letter-spacing: 2px;
    pointer-events: none;
  }

  /* ── Score popup canvas overlay ── */
  #popup-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 12;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<canvas id="popup-layer"></canvas>

<div id="hud">
  <div class="hud-card">
    <div class="hud-label">Puntuación</div>
    <div class="hud-val" id="score-el">0</div>
  </div>
  <div class="hud-card" style="text-align:center">
    <div class="hud-label">Oleada</div>
    <div class="hud-val" id="wave-el">1</div>
  </div>
  <div class="hud-card" style="text-align:right">
    <div class="hud-label">Vidas</div>
    <div id="lives-row">
      <div class="heart" id="h1"></div>
      <div class="heart" id="h2"></div>
      <div class="heart" id="h3"></div>
    </div>
  </div>
</div>

<div id="overlay">
  <h1>NEBULA<br>BLITZ</h1>
  <p class="sub">Sobrevive las oleadas de asteroides</p>
  <p class="sub" style="margin-top:4px;font-size:11px">WASD · mover &nbsp;|&nbsp; RATÓN · apuntar &nbsp;|&nbsp; CLICK · disparar &nbsp;|&nbsp; ESPACIO · ráfaga</p>
  <button class="neon-btn" id="start-btn">INICIAR JUEGO</button>
</div>

<div id="wave-msg">OLEADA 1</div>

<svg id="xhair" width="28" height="28" viewBox="0 0 28 28">
  <circle cx="14" cy="14" r="9" fill="none" stroke="#00ffc8" stroke-width="1.2"/>
  <line x1="14" y1="1"  x2="14" y2="8"  stroke="#00ffc8" stroke-width="1.2"/>
  <line x1="14" y1="20" x2="14" y2="27" stroke="#00ffc8" stroke-width="1.2"/>
  <line x1="1"  y1="14" x2="8"  y2="14" stroke="#00ffc8" stroke-width="1.2"/>
  <line x1="20" y1="14" x2="27" y2="14" stroke="#00ffc8" stroke-width="1.2"/>
</svg>

<div id="hint">WASD · MOVER — CLICK · DISPARAR — ESPACIO · RÁFAGA</div>

<!-- Three.js via importmap -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────
//  RENDERER
// ─────────────────────────────────────────────
const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled  = true;
renderer.shadowMap.type     = THREE.PCFSoftShadowMap;
renderer.toneMapping        = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;

// ─────────────────────────────────────────────
//  SCENE / CAMERA
// ─────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000510);
scene.fog = new THREE.Fog(0x000510, 50, 90);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 24, 14);
camera.lookAt(0, 0, 0);

// ─────────────────────────────────────────────
//  LIGHTS
// ─────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x001122, 0.6));

const sunLight = new THREE.DirectionalLight(0x8899ff, 0.8);
sunLight.position.set(-10, 20, -10);
scene.add(sunLight);

const arenaLight = new THREE.PointLight(0x00ffc8, 1.2, 50);
arenaLight.position.set(0, 12, 0);
scene.add(arenaLight);

// ─────────────────────────────────────────────
//  STARFIELD
// ─────────────────────────────────────────────
{
  const count = 3500, pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i*3]   = (Math.random()-.5)*220;
    pos[i*3+1] = (Math.random()-.5)*120 - 25;
    pos[i*3+2] = (Math.random()-.5)*220;
    const b = .3 + Math.random()*.7;
    const t = Math.random();
    col[i*3]   = t < .4 ? b : b*.4;
    col[i*3+1] = t < .4 ? b : b*.7;
    col[i*3+2] = b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const stars = new THREE.Points(geo,
    new THREE.PointsMaterial({ size:.14, vertexColors:true, transparent:true, opacity:.9, sizeAttenuation:true })
  );
  scene.add(stars);
}

// ─────────────────────────────────────────────
//  ARENA FLOOR
// ─────────────────────────────────────────────
{
  const grid = new THREE.GridHelper(42, 21, 0x003333, 0x001515);
  grid.position.y = -.55;
  scene.add(grid);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(19.6, 20.2, 72),
    new THREE.MeshBasicMaterial({ color:0x00ffc8, side:THREE.DoubleSide, transparent:true, opacity:.12 })
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.y = -.5;
  scene.add(ring);

  // Glow ring light
  const ringLight = new THREE.PointLight(0x00ffc8, .4, 6);
  ringLight.position.set(20, 0, 0);
  scene.add(ringLight);
}

// ─────────────────────────────────────────────
//  PLAYER SHIP
// ─────────────────────────────────────────────
function buildShip() {
  const g = new THREE.Group();

  // Hull
  const hull = new THREE.Mesh(
    new THREE.ConeGeometry(.38, 1.3, 6),
    new THREE.MeshPhongMaterial({ color:0x00aaff, emissive:0x001a33, shininess:120 })
  );
  hull.rotation.x = Math.PI/2;
  g.add(hull);

  // Wing L
  const wMat = new THREE.MeshPhongMaterial({ color:0x0055aa, emissive:0x001122, side:THREE.DoubleSide });
  [[-.55, .25], [.55, -.25]].forEach(([ox, oz]) => {
    const w = new THREE.Mesh(
      (() => {
        const wg = new THREE.BufferGeometry();
        wg.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
          0,0,-.55, ox,0,.1, 0,0,.4
        ]), 3));
        wg.computeVertexNormals();
        return wg;
      })(),
      wMat
    );
    g.add(w);
  });

  // Engine glow sphere
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(.13, 8, 8),
    new THREE.MeshBasicMaterial({ color:0x00ffaa })
  );
  glow.position.z = .55;
  g.add(glow);
  g.userData.glow = glow;

  // Engine point light
  const el = new THREE.PointLight(0x00ffaa, 1.5, 5);
  el.position.z = .55;
  g.add(el);
  g.userData.engineLight = el;

  return g;
}

const ship = buildShip();
scene.add(ship);

// ─────────────────────────────────────────────
//  AUDIO (Web Audio API)
// ─────────────────────────────────────────────
let _actx = null;
const actx = () => {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  return _actx;
};

function sfxShoot() {
  try {
    const c = actx(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.setValueAtTime(900, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(180, c.currentTime + .09);
    g.gain.setValueAtTime(.22, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .09);
    o.start(); o.stop(c.currentTime + .09);
  } catch(_) {}
}

function sfxBoom(loud = false) {
  try {
    const c = actx(), sz = c.sampleRate * .35, buf = c.createBuffer(1, sz, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < sz; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/sz, .4);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain();
    src.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(loud ? .9 : .45, c.currentTime);
    src.start();
  } catch(_) {}
}

function sfxHit() {
  try {
    const c = actx(), o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.connect(g); g.connect(c.destination);
    o.frequency.setValueAtTime(160, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(40, c.currentTime + .4);
    g.gain.setValueAtTime(.6, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .4);
    o.start(); o.stop(c.currentTime + .4);
  } catch(_) {}
}

// ─────────────────────────────────────────────
//  GAME STATE
// ─────────────────────────────────────────────
let score = 0, lives = 3, wave = 1, active = false;
let asteroids = [], bullets = [], particles = [], scorePopups = [];
let lastSpawn = 0, spawnMs = 1700;
let waveTimer = 0, invincibleUntil = 0;
let combo = 0, lastKill = 0;
let camShake = 0;
let lastBurst = 0;

// ─────────────────────────────────────────────
//  ASTEROID FACTORY
// ─────────────────────────────────────────────
function spawnAsteroid(forcedSize) {
  const sz = forcedSize ?? (Math.random() < .15 ? 2.4 : Math.random() < .3 ? 1.6 : 1.0);
  const geo = new THREE.IcosahedronGeometry(sz * (.65 + Math.random()*.35), sz > 1.4 ? 1 : 0);

  // Deform
  const pa = geo.attributes.position;
  for (let i = 0; i < pa.count; i++)
    pa.setXYZ(i, pa.getX(i)*(0.75+Math.random()*.5), pa.getY(i)*(0.75+Math.random()*.5), pa.getZ(i)*(0.75+Math.random()*.5));
  geo.computeVertexNormals();

  const shade = Math.floor(0x44 + Math.random()*0x44);
  const mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
    color: (shade<<16)|(Math.floor(shade*.9)<<8)|Math.floor(shade*.8),
    shininess: 18
  }));

  const angle = Math.random() * Math.PI * 2;
  const r = 23 + Math.random()*3;
  mesh.position.set(Math.cos(angle)*r, 0, Math.sin(angle)*r);

  const tx = (Math.random()-.5)*10, tz = (Math.random()-.5)*10;
  const dir = new THREE.Vector3(tx - mesh.position.x, 0, tz - mesh.position.z).normalize();
  const spd = (1.8 + Math.random()*2.2 + wave*.35) / sz;
  mesh.userData.vel  = dir.multiplyScalar(spd);
  mesh.userData.rot  = new THREE.Euler((Math.random()-.5)*.07,(Math.random()-.5)*.07,(Math.random()-.5)*.07);
  mesh.userData.sz   = sz;
  mesh.userData.hp   = sz > 1.4 ? 2 : 1;

  scene.add(mesh);
  asteroids.push(mesh);
}

// ─────────────────────────────────────────────
//  BULLET FACTORY
// ─────────────────────────────────────────────
function fireBullet(dir) {
  const geo = new THREE.CylinderGeometry(.035, .035, .55, 6);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffff44 });
  const b = new THREE.Mesh(geo, mat);
  b.position.copy(ship.position);
  b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());

  const bl = new THREE.PointLight(0xffff44, 2, 2.5);
  b.add(bl);

  b.userData.vel  = dir.clone().normalize().multiplyScalar(28);
  b.userData.age  = 0;

  scene.add(b);
  bullets.push(b);
  sfxShoot();
}

// ─────────────────────────────────────────────
//  PARTICLE EXPLOSION
// ─────────────────────────────────────────────
function explode(pos, color, n = 26) {
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(Math.random()*.12+.03, 4, 4),
      new THREE.MeshBasicMaterial({ color, transparent:true, opacity:1 })
    );
    p.position.copy(pos);
    const spd = 3 + Math.random()*9;
    const th = Math.random()*Math.PI*2, ph = Math.random()*Math.PI;
    p.userData.vel   = new THREE.Vector3(
      Math.sin(ph)*Math.cos(th)*spd,
      Math.cos(ph)*spd*.3,
      Math.sin(ph)*Math.sin(th)*spd
    );
    p.userData.life  = 1;
    p.userData.decay = 1.4 + Math.random()*1.8;
    scene.add(p);
    particles.push(p);
  }
}

// ─────────────────────────────────────────────
//  SCORE POPUP (2D canvas layer)
// ─────────────────────────────────────────────
const pop2d = document.getElementById('popup-layer');
pop2d.width  = innerWidth;
pop2d.height = innerHeight;
const popCtx = pop2d.getContext('2d');

function addPopup(worldPos, text, color) {
  const ndc = worldPos.clone().project(camera);
  const sx  = (ndc.x + 1) / 2 * innerWidth;
  const sy  = (1 - ndc.y) / 2 * innerHeight;
  scorePopups.push({ x:sx, y:sy, text, color, life:1 });
}

function drawPopups(dt) {
  popCtx.clearRect(0, 0, pop2d.width, pop2d.height);
  for (let i = scorePopups.length - 1; i >= 0; i--) {
    const p = scorePopups[i];
    p.life -= dt * 1.8;
    p.y    -= dt * 40;
    if (p.life <= 0) { scorePopups.splice(i, 1); continue; }
    popCtx.globalAlpha = p.life;
    popCtx.font        = `bold ${18 + (1-p.life)*8}px Orbitron, monospace`;
    popCtx.fillStyle   = p.color;
    popCtx.shadowColor = p.color;
    popCtx.shadowBlur  = 8;
    popCtx.fillText(p.text, p.x, p.y);
  }
  popCtx.globalAlpha = 1;
  popCtx.shadowBlur  = 0;
}

// ─────────────────────────────────────────────
//  CONTROLS
// ─────────────────────────────────────────────
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space') e.preventDefault(); });
addEventListener('keyup',   e => { keys[e.code] = false; });

const mouse   = new THREE.Vector2();
const raycast = new THREE.Raycaster();
const ground  = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const mWorld  = new THREE.Vector3();
const xhair   = document.getElementById('xhair');

addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x  = ((e.clientX-r.left)/r.width)*2-1;
  mouse.y  = -((e.clientY-r.top)/r.height)*2+1;
  xhair.style.left = e.clientX + 'px';
  xhair.style.top  = e.clientY + 'px';
  raycast.setFromCamera(mouse, camera);
  raycast.ray.intersectPlane(ground, mWorld);
});

addEventListener('click',    () => { if (active) shoot(); });
addEventListener('keydown', e => { if (e.code==='Space' && active) burst(); });

function shoot() {
  const dir = new THREE.Vector3(mWorld.x - ship.position.x, 0, mWorld.z - ship.position.z);
  if (dir.lengthSq() < .001) return;
  fireBullet(dir.normalize());
}

function burst() {
  const now = Date.now();
  if (now - lastBurst < 550) return;
  lastBurst = now;
  const base = new THREE.Vector3(mWorld.x - ship.position.x, 0, mWorld.z - ship.position.z).normalize();
  [-1,0,1].forEach((i, idx) => {
    setTimeout(() => {
      if (!active) return;
      const d = base.clone().applyAxisAngle(new THREE.Vector3(0,1,0), i*.18);
      fireBullet(d);
    }, idx * 55);
  });
}

// ─────────────────────────────────────────────
//  HUD UPDATE
// ─────────────────────────────────────────────
function refreshHUD() {
  document.getElementById('score-el').textContent = score.toLocaleString('es');
  document.getElementById('wave-el').textContent  = wave;
  for (let i = 1; i <= 3; i++)
    document.getElementById(`h${i}`).classList.toggle('dead', i > lives);
}

function announceWave(n) {
  const el = document.getElementById('wave-msg');
  el.textContent = `OLEADA ${n}`;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2200);
}

// ─────────────────────────────────────────────
//  GAME START / END
// ─────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', startGame);

function startGame() {
  document.getElementById('overlay').style.display = 'none';

  // Reset state
  score = 0; lives = 3; wave = 1; combo = 0;
  waveTimer = 0; spawnMs = 1700; invincibleUntil = 0; camShake = 0;

  asteroids.forEach(a => scene.remove(a));
  bullets.forEach(b => scene.remove(b));
  particles.forEach(p => scene.remove(p));
  asteroids = []; bullets = []; particles = []; scorePopups = [];

  ship.position.set(0, 0, 0);
  refreshHUD();
  active = true;
  announceWave(1);
  clock.start();
}

function gameOver() {
  active = false;
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1 style="color:#ff3355;text-shadow:0 0 30px #ff3355,0 0 60px #ff335580">GAME<br>OVER</h1>
    <p class="sub" style="font-size:15px;margin-top:8px">Puntuación final</p>
    <div style="font-size:clamp(40px,8vw,64px);color:#ffaa00;text-shadow:0 0 20px #ffaa00;margin:12px 0;font-family:'Orbitron',monospace;font-weight:700">${score.toLocaleString('es')}</div>
    <p class="sub">Oleada ${wave} alcanzada</p>
    <button class="neon-btn" id="start-btn">REINTENTAR</button>
  `;
  ov.style.display = 'flex';
  document.getElementById('start-btn').addEventListener('click', startGame);
}

// ─────────────────────────────────────────────
//  MAIN LOOP
// ─────────────────────────────────────────────
const clock = new THREE.Clock();

function loop() {
  requestAnimationFrame(loop);
  const dt  = Math.min(clock.getDelta(), .05);
  const now = Date.now();

  if (!active) {
    renderer.render(scene, camera);
    return;
  }

  // ── Wave progression ──────────────────────
  waveTimer += dt;
  if (waveTimer >= 30) {
    waveTimer = 0;
    wave++;
    spawnMs = Math.max(380, spawnMs - 180);
    announceWave(wave);
    refreshHUD();
  }

  // ── Spawn asteroids ───────────────────────
  if (now - lastSpawn > spawnMs) {
    lastSpawn = now;
    const extras = wave > 4 && Math.random() < .35 ? 1 : 0;
    for (let i = 0; i <= extras; i++) spawnAsteroid();
  }

  // ── Move player ───────────────────────────
  const spd = 13 * dt;
  const moving = keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight;
  if (keys.KeyW||keys.ArrowUp)    ship.position.z -= spd;
  if (keys.KeyS||keys.ArrowDown)  ship.position.z += spd;
  if (keys.KeyA||keys.ArrowLeft)  ship.position.x -= spd;
  if (keys.KeyD||keys.ArrowRight) ship.position.x += spd;

  const lim = 18.5;
  ship.position.x = Math.max(-lim, Math.min(lim, ship.position.x));
  ship.position.z = Math.max(-lim, Math.min(lim, ship.position.z));

  // Aim toward mouse
  const dx = mWorld.x - ship.position.x, dz = mWorld.z - ship.position.z;
  if (Math.abs(dx)+Math.abs(dz) > .1) ship.rotation.y = Math.atan2(dx, dz);

  // Engine glow
  const pulse = .8 + Math.sin(now * .012) * .2;
  ship.userData.engineLight.intensity = moving ? 2.5*pulse : .6*pulse;
  ship.userData.glow.material.color.setHSL(.45, 1, moving ? .55*pulse : .25*pulse);

  // Camera follow
  const camTargetX = ship.position.x, camTargetZ = ship.position.z + 14;
  camera.position.x += (camTargetX - camera.position.x) * .07;
  camera.position.z += (camTargetZ - camera.position.z) * .07;
  if (camShake > 0) {
    camera.position.x += (Math.random()-.5) * camShake;
    camera.position.y += (Math.random()-.5) * camShake * .25;
    camShake *= .75;
    if (camShake < .01) camShake = 0;
  }
  camera.lookAt(ship.position);

  // ── Bullets ───────────────────────────────
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.addScaledVector(b.userData.vel, dt);
    b.userData.age += dt;
    if (b.userData.age > 2.8) { scene.remove(b); bullets.splice(i,1); continue; }

    let hit = false;
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      if (b.position.distanceTo(a.position) < a.userData.sz * .72 + .28) {
        a.userData.hp--;
        explode(b.position.clone(), 0xff8833, 10);

        if (a.userData.hp <= 0) {
          const pts = Math.round(a.userData.sz * 100);
          if (now - lastKill < 2200) combo = Math.min(combo + 1, 10);
          else combo = 1;
          lastKill = now;
          const total = pts * combo;
          score += total;

          explode(a.position.clone(), a.userData.sz > 1.4 ? 0xff6600 : 0xff9900, Math.round(a.userData.sz * 22));
          sfxBoom(a.userData.sz > 1.4);

          if (a.userData.sz > 1.3) {
            spawnAsteroid(a.userData.sz * .52);
            spawnAsteroid(a.userData.sz * .52);
          }

          addPopup(a.position.clone(), combo > 1 ? `+${total} ×${combo}` : `+${total}`, combo > 1 ? '#ffaa00' : '#00ffc8');
          scene.remove(a); asteroids.splice(j, 1);
          refreshHUD();
        } else {
          a.material.emissive.set(0xff0000);
          setTimeout(() => { if (a.material) a.material.emissive.set(0); }, 90);
        }

        scene.remove(b); bullets.splice(i, 1);
        hit = true; break;
      }
    }
    if (hit) continue;
  }

  // ── Asteroids ─────────────────────────────
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.position.addScaledVector(a.userData.vel, dt);
    a.rotation.x += a.userData.rot.x;
    a.rotation.y += a.userData.rot.y;
    a.rotation.z += a.userData.rot.z;

    if (a.position.length() > 42) { scene.remove(a); asteroids.splice(i,1); continue; }

    if (a.position.distanceTo(ship.position) < a.userData.sz * .72 + .38 && now > invincibleUntil) {
      explode(a.position.clone(), 0xff1133, 40);
      sfxHit();
      scene.remove(a); asteroids.splice(i, 1);
      lives--;
      combo = 0;
      invincibleUntil = now + 2200;
      camShake = 1.2;
      refreshHUD();
      if (lives <= 0) { gameOver(); return; }
    }
  }

  // Ship blink when invincible
  ship.visible = now < invincibleUntil ? Math.floor(now / 110) % 2 === 0 : true;

  // ── Particles ─────────────────────────────
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.position.addScaledVector(p.userData.vel, dt);
    p.userData.vel.multiplyScalar(.93);
    p.userData.life -= p.userData.decay * dt;
    p.material.opacity = p.userData.life;
    p.scale.setScalar(Math.max(0, p.userData.life));
    if (p.userData.life <= 0) { scene.remove(p); particles.splice(i,1); }
  }

  // ── Score popups ──────────────────────────
  drawPopups(dt);

  renderer.render(scene, camera);
}

// ─────────────────────────────────────────────
//  RESIZE
// ─────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  pop2d.width  = innerWidth;
  pop2d.height = innerHeight;
});

// Go!
loop();
</script>
</body>
</html>
